<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>FROSTLINE design mockups</title>
<style>
  body { margin: 0; background: #0b0d1a; color: #fff1e0; font: 14px/1.4 ui-monospace, Menlo, monospace; }
  h1 { font-size: 18px; color: #f28c28; margin: 16px 20px 4px; }
  p.lead { margin: 0 20px 12px; color: #8a8fa8; max-width: 980px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 14px; padding: 0 20px 24px; }
  .card { background: #141626; border: 2px solid #3a3f66; border-radius: 6px; padding: 12px; }
  .card.current { border-color: #55607a; }
  .card h2 { margin: 0; font-size: 15px; color: #5ef0c8; }
  .card .tag { color: #8a8fa8; font-size: 12px; margin: 2px 0 8px; }
  canvas { image-rendering: pixelated; background: #1c1f36; border-radius: 3px; display: block; }
  .poses { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .poses div { font-size: 11px; color: #8a8fa8; text-align: center; }
  .controls { margin: 0 20px 12px; display: flex; gap: 16px; color: #8a8fa8; }
  .controls label { cursor: pointer; }
</style>
</head>
<body>
<script src="kit.js"></script>
<script>
const PAL = {
  K: '#1a1428', W: '#ffffff', w: '#e6f4ff', G: '#8a8fa8', g: '#55607a', d: '#2b2540', x: '#141226',
  // ice blues
  C: '#e6f8ff', B: '#9ee0f8', b: '#4aa8d8', n: '#2a6aa8', m: '#1a3a6a',
  // penguin: black, cream, gold
  k: '#2a2a3a', j: '#14141e', Z: '#fff4dc', Y: '#ffd24a', y: '#d89a20', O: '#f28c28',
  // crystal: translucent cyans
  V: '#c8fbff', v: '#7ae8f8', u: '#3ab0d8',
};
const R = (shine, light, base, dark) => ({ shine, light, base, dark });
const W = 48, H = 44;
const MOVES = [
  { name: 'idle', len: 70 }, { name: 'windup', len: 26 }, { name: 'slide', len: 40 }, { name: 'idle', len: 20 },
  { name: 'volley', len: 40 }, { name: 'idle', len: 16 }, { name: 'hail', len: 50 },
];
function pose(m, f) {
  const P = { breath: (Math.sin(f * 0.09) + 1) / 2, t: f, slide: 0, flap: 0, look: 0, crouch: 0 };
  if (m.name === 'windup') { P.crouch = Math.min(1, m.k * 2); }
  if (m.name === 'slide') P.slide = 1;
  if (m.name === 'volley') P.flap = Math.abs(Math.sin(m.t * 0.35));
  if (m.name === 'hail') P.look = Math.min(1, m.t / 8);
  return P;
}

function bird(P, s) {
  const b = new Buf(W, H, PAL);
  const ground = H - 1;
  const cx = 24;
  if (P.slide) {
    // Belly-down: a flattened body skimming the ice, beak forward, feet trailing.
    const y = ground - 6;
    b.part(ellipse(cx - 13, y + 2, 3, 1.5), s.back); // feet
    b.part(ellipse(cx, y, 15, 6), s.body);
    b.part(ellipse(cx + 1, y + 2.5, 12, 3), s.belly, { shine: false });
    b.part(poly([[cx + 14, y - 2], [cx + 21, y], [cx + 14, y + 1]]), s.beak);
    b.px(cx + 10, y - 3, 'K'); b.px(cx + 10, y - 4, 'W');
    if (s.crest) for (let i = 0; i < 3; i++) b.part(poly([[cx - 2 + i * 4, y - 5], [cx - 4 + i * 4, y - 10], [cx + i * 4, y - 5]]), s.crest);
    b.outline();
    return { b, glow: { eye: [cx + 10, y - 3], core: [cx, y] } };
  }
  const tall = s.tall ?? 0;
  const drop = P.crouch * 2;
  const top = 14 - tall + drop + P.breath * 0.4;
  const by = top + 13;
  // Feet.
  b.part(ellipse(cx - 5, ground - 1, 4, 1.8), s.feet);
  b.part(ellipse(cx + 5, ground - 1, 4, 1.8), s.feet);
  // Back flipper.
  const fl = P.flap;
  b.part(poly([[cx - 10, by - 4], [cx - 17 - fl * 3, by + 3 - fl * 10], [cx - 11, by + 6]]), s.back);
  // Body (round; taller for the penguin), belly.
  b.part(ellipse(cx, by, 13, 13 + tall * 0.5), s.body);
  b.part(ellipse(cx + 2, by + 3, 9, 9 + tall * 0.4), s.belly, { shine: false });
  if (s.facets) for (const [x0, y0, x1, y1] of [[-8, -6, -2, 4], [3, -9, 9, -1], [-5, 6, 4, 10], [6, 2, 10, 8]]) b.line([[cx + x0, by + y0], [cx + x1, by + y1]], s.facets);
  if (s.fluff) for (const [dx, dy] of [[-3, 0], [3, 3], [-1, 6], [5, -2]]) b.px(cx + 2 + dx, by + 3 + dy, s.fluff);
  // The head is the top of the body: eyes, a beak (pointed up for the hail call).
  const hx = cx + 5, hy = top + 5 - P.look * 2;
  b.part(ellipse(hx, hy, 2.4, 2.4), { shine: 'W', light: 'W', base: 'W', dark: 'w' });
  b.px(hx + 0.6, hy, 'K'); b.px(hx + 0.6, hy + 1, 'K');
  const ba = -P.look * 0.9;
  const bx0 = hx + 4, by0 = hy + 2;
  b.part(poly([[bx0, by0 - 1.5], [bx0 + Math.cos(ba) * 7, by0 + Math.sin(ba) * 7], [bx0, by0 + 1.5]]), s.beak);
  if (s.neck) b.part(ellipse(hx + 2, hy + 6, 2.5, 1.8), s.neck, { shine: false });
  // Crest: ice spikes (or the knight's crystal-crested helm).
  if (s.helm) {
    b.part(poly([[cx - 9, top + 3], [cx + 9, top + 1], [cx + 10, top + 5], [cx - 10, top + 7]]), s.helm);
    b.part(poly([[cx - 3, top + 2], [cx + 1, top - 9], [cx + 3, top + 1]]), s.crest);
  } else if (s.crest) for (let i = 0; i < 3; i++) b.part(poly([[cx - 6 + i * 4, top], [cx - 7 + i * 4, top - 5 - (i === 1 ? 2 : 0)], [cx - 3 + i * 4, top]]), s.crest);
  // Front flipper (raised to throw the shards).
  b.part(poly([[cx + 6, by - 3], [cx + 15 + fl * 3, by + 4 - fl * 11], [cx + 9, by + 7]]), s.flipper ?? s.body);
  if (s.pauldron) b.part(ellipse(cx + 8, by - 3, 4, 3), s.pauldron);
  b.outline();
  return { b, glow: { eye: [hx, hy], core: [cx, by] } };
}
const ICE = R('C', 'B', 'b', 'n');
const STYLES = {
  snow: { body: ICE, back: R('B', 'b', 'n', 'm'), belly: R('W', 'W', 'w', 'C'), beak: R('Y', 'Y', 'O', 'y'), feet: R('B', 'b', 'n', 'm'), crest: R('W', 'C', 'B', 'b'), fluff: 'C' },
  knight: { tall: 5, body: R('k', 'k', 'j', 'x'), back: R('k', 'j', 'x', 'x'), belly: R('W', 'Z', 'Z', 'w'), beak: R('Y', 'Y', 'O', 'y'), feet: R('O', 'O', 'y', 'o'), neck: R('Y', 'Y', 'Y', 'y'), helm: ICE, crest: R('C', 'C', 'B', 'b'), pauldron: ICE, flipper: R('k', 'k', 'j', 'x') },
  crystal: { body: R('V', 'v', 'u', 'n'), back: R('v', 'u', 'n', 'm'), belly: R('V', 'V', 'v', 'u'), beak: R('C', 'C', 'B', 'b'), feet: R('v', 'u', 'n', 'm'), crest: R('V', 'V', 'v', 'u'), facets: 'C' },
};
Kit.start({
  name: 'FROSTLINE',
  lead: 'Each card plays Frostline\'s move set: idle, the flashing wind-up, a belly-slide across the ice (spraying frost), a volley of ice shards thrown off a flipper, then the hail call (beak to the sky, blocks fall). Big view 5x next to UltraGuy; game-scale poses below. Frost spray, snow and glints are effects added on top. CURRENT is today\'s three poses.',
  currentTag: "Today's Frostline: three poses (idle, slide, shoot).",
  currentFrame: (m) => (m.name === 'slide' ? 'frostline_slide' : m.name === 'volley' || m.name === 'hail' ? 'frostline_shoot' : 'frostline_idle'),
  floor: ['#2a4a6a', '#dceaf8'],
  moves: MOVES, pose,
  minis: [['idle', { name: 'idle', t: 0, k: 0 }], ['slide', { name: 'slide', t: 10, k: 0.3 }], ['volley', { name: 'volley', t: 5, k: 0.2 }], ['hail', { name: 'hail', t: 20, k: 0.5 }]],
  place: (m) => {
    if (m.name === 'windup') return { x: 62 + (m.t % 4 < 2 ? 0.5 : -0.5) };
    if (m.name === 'slide') return { x: lerp(62, 36, ease(m.k)) };
    if (['idle', 'volley', 'hail'].includes(m.name) && m.t >= 0) return { x: 62 };
    return { x: 62 };
  },
  effects: (env) => {
    const { ctx, m, card, S, fi, ox, oy, glow, groundY } = env;
    if (env.current) return;
    if (m.name === 'slide' && fi % 2 === 0) for (let i = 0; i < 3; i++) Kit.push(card, { x: ox + (24 + 14) * S, y: groundY - S, vx: 2 + Math.random() * 3, vy: -1 - Math.random() * 3, g: 0.3, life: 18, snow: true });
    if (m.name === 'volley' && m.t % 10 === 5) Kit.push(card, { x: ox + 38 * S, y: oy + 18 * S, vx: -8 - Math.random() * 3, vy: -7, g: 0.5, life: 50, shard: true });
    if (m.name === 'hail' && m.t % 12 === 6) Kit.push(card, { x: (10 + Math.random() * 70) * S, y: 0, vx: 0, vy: 3, g: 0.4, life: 60, block: true });
    if (fi % 3 === 0) Kit.push(card, { x: Math.random() * 460, y: 0, vx: -0.5, vy: 1.2, life: 240, flake: true });
    Kit.run(env, (p) => {
      if (p.y > groundY) p.life = 0;
      ctx.fillStyle = p.flake ? 'rgba(255,255,255,0.7)' : p.block ? '#9ee0f8' : '#e6f8ff';
      const sz = p.block ? 3 * S : p.shard ? 1.6 * S : S * 0.8;
      ctx.fillRect(p.x, p.y, sz, sz);
    });
    if (fi % 50 < 3) glowAt(ctx, ox + (glow.core[0] - 6) * S, oy + (glow.core[1] - 8) * S, 4 * S, '255,255,255', 0.9);
    if (card.d.id === 'crystal') glowAt(ctx, ox + glow.core[0] * S, oy + glow.core[1] * S, 14 * S, '158,232,255', 0.25);
  },
  designs: [
    { id: 'snow', name: 'A. SNOWBALL BIRD+', tag: "Today's Frostline drawn properly: a round ice-blue bird with a fluffy white belly, a crest of ice spikes, stubby flippers and a gold beak. On the slide he flattens belly-down and skims the ice, throwing frost. Closest to now.", draw: (P) => bird(P, STYLES.snow) },
    { id: 'knight', name: 'B. PENGUIN KNIGHT', tag: 'An emperor penguin in ice armor: black and cream with a gold neck, a helm of ice with a crystal crest, an ice pauldron. Taller and more imposing; still slides on his belly like a toboggan.', draw: (P) => bird(P, STYLES.knight) },
    { id: 'crystal', name: 'C. CRYSTAL BIRD', tag: 'Made of ice: a translucent, faceted crystal body with white facet lines, glowing faintly from inside. The most magical; reads as a living ice sculpture.', draw: (P) => bird(P, STYLES.crystal) },
  ],
});

</script>
</body>
</html>
