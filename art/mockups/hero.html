<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>UltraGuy design mockups</title>
<style>
  body { margin: 0; background: #0b0d1a; color: #fff1e0; font: 14px/1.4 ui-monospace, Menlo, monospace; }
  h1 { font-size: 18px; color: #f28c28; margin: 16px 20px 4px; }
  p.lead { margin: 0 20px 12px; color: #8a8fa8; max-width: 900px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 14px; padding: 0 20px 24px; }
  .card { background: #141626; border: 2px solid #3a3f66; border-radius: 6px; padding: 12px; }
  .card.current { border-color: #55607a; }
  .card h2 { margin: 0; font-size: 15px; color: #5ef0c8; }
  .card .tag { color: #8a8fa8; font-size: 12px; margin: 2px 0 8px; }
  .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  canvas { image-rendering: pixelated; background: #2a3150; border-radius: 3px; }
  .label { font-size: 11px; color: #8a8fa8; text-align: center; }
  .strip { margin-top: 8px; }
  .controls { margin: 0 20px 12px; display: flex; gap: 16px; color: #8a8fa8; }
  .controls label { cursor: pointer; }
</style>
</head>
<body>
<h1>ULTRAGUY: design mockups</h1>
<p class="lead">Each design runs on the same rig: an 8-frame run with a body bob, arm swing, forward lean and a
head that lags a beat. The big view is 6x; the strip under it runs at game scale over a moving floor, at the
game's run speed. CURRENT is today's 3-pose run for comparison.</p>
<div class="controls">
  <label><input type="checkbox" id="shoot" /> run and shoot</label>
  <label><input type="checkbox" id="slow" /> slow motion</label>
</div>
<div class="grid" id="grid"></div>

<script>
// --- palette (the game's hero colors) ------------------------------------------------
const PAL = {
  K: '#1a1428', Z: '#ffe4b0', L: '#ffc070', O: '#f28c28', o: '#b85a1a', D: '#7a3410',
  S: '#2b2540', s: '#4a4068', X: '#1e1a30', V: '#5ef0c8', v: '#2aa088', W: '#fff1e0',
  G: '#8a8fa8', g: '#55607a', R: '#e8484e', r: '#a02838', q: '#6a1828',
};
const RAMP = {
  armor: { shine: 'Z', light: 'L', base: 'O', dark: 'o' },
  armorBack: { shine: 'L', light: 'O', base: 'o', dark: 'D' },
  suit: { shine: 's', light: 's', base: 'S', dark: 'X' },
  suitBack: { shine: 'S', light: 'S', base: 'X', dark: 'X' },
  metal: { shine: 'W', light: 'G', base: 'G', dark: 'g' },
  scarf: { shine: 'R', light: 'R', base: 'r', dark: 'q' },
};

// --- pixel buffer with shaded, outlined parts -----------------------------------------
class Buf {
  constructor(w, h) { this.w = w; this.h = h; this.c = new Array(w * h).fill(''); }
  /** Fill a shape (inside(x, y) at pixel centers), shaded top-light/bottom-dark, outlined against what's behind. */
  part(inside, ramp, { shine = true } = {}) {
    const { w, h } = this;
    const m = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (inside(x + 0.5, y + 0.5)) m[y * w + x] = 1;
    const at = (x, y) => x >= 0 && y >= 0 && x < w && y < h && m[y * w + x];
    // Separate from what's behind with an outline drawn on the behind side.
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (!at(x, y)) continue;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= w || ny >= h || at(nx, ny)) continue;
        if (this.c[ny * w + nx]) this.c[ny * w + nx] = 'K';
      }
    }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (!at(x, y)) continue;
      let c = ramp.base;
      if (!at(x, y - 1)) c = shine && !at(x - 1, y) ? ramp.shine : ramp.light;
      else if (!at(x, y + 1)) c = ramp.dark;
      else if (!at(x, y + 2) && (x + y) % 2 === 0) c = ramp.dark;
      this.c[y * w + x] = c;
    }
  }
  px(x, y, c) {
    x = Math.round(x); y = Math.round(y);
    if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.c[y * this.w + x] = c;
  }
  outline() {
    const { w, h } = this;
    const out = this.c.slice();
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (this.c[y * w + x]) continue;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && ny >= 0 && nx < w && ny < h && this.c[ny * w + nx] && this.c[ny * w + nx] !== 'K') { out[y * w + x] = 'K'; break; }
      }
    }
    this.c = out;
  }
  draw(ctx, ox, oy, s) {
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const c = this.c[y * this.w + x];
      if (!c) continue;
      ctx.fillStyle = PAL[c];
      ctx.fillRect(ox + x * s, oy + y * s, s, s);
    }
  }
}

// Shapes.
const capsule = (ax, ay, bx, by, r) => (x, y) => {
  const dx = bx - ax, dy = by - ay;
  const t = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy || 1)));
  return Math.hypot(x - ax - dx * t, y - ay - dy * t) <= r;
};
const ellipse = (cx, cy, rx, ry) => (x, y) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1;
const rrect = (x0, y0, x1, y1, rad = 1) => (x, y) => {
  if (x < x0 || x > x1 || y < y0 || y > y1) return false;
  const cx = Math.max(x0 + rad, Math.min(x1 - rad, x));
  const cy = Math.max(y0 + rad, Math.min(y1 - rad, y));
  return Math.hypot(x - cx, y - cy) <= rad + 0.01;
};

/** Two-bone IK: knee/elbow between root and end; bend > 0 bends toward +x. */
function ik(hx, hy, fx, fy, a, b, bend) {
  let d = Math.hypot(fx - hx, fy - hy);
  d = Math.min(d, a + b - 0.01);
  const base = Math.atan2(fy - hy, fx - hx);
  const alpha = Math.acos(Math.max(-1, Math.min(1, (a * a + d * d - b * b) / (2 * a * d))));
  const ang = base - bend * alpha;
  return [hx + Math.cos(ang) * a, hy + Math.sin(ang) * a];
}

// --- the rig -------------------------------------------------------------------------------

/**
 * Pose for a design: pose = 'idle' | 'run' | 'jump', t = 0..1 through the cycle.
 * Returns joint positions (frame pixels, facing right).
 */
function rig(d, pose, t, shoot) {
  const ground = d.H - 1;
  const legLen = d.thigh + d.shin;
  const ankleGround = ground - d.bootH + 1;
  const p = t * Math.PI * 2;
  let hipX = d.hipX;
  let bob = 0, headBob = 0, lean = 0;
  let feet, arms;
  if (pose === 'run') {
    bob = d.bob * (Math.cos(2 * p) + 1) / 2;
    headBob = d.bob * (Math.cos(2 * (p - 0.7)) + 1) / 2;
    lean = d.lean;
    feet = [p, p + Math.PI].map((q) => {
      const x = hipX + d.stride * Math.sin(q) - 0.5;
      const y = Math.cos(q) < 0 ? ankleGround : ankleGround - d.lift * Math.cos(q);
      return [x, y];
    });
    arms = [p + Math.PI, p].map((q) => d.armSwing * Math.sin(q));
  } else if (pose === 'idle') {
    bob = (Math.sin(p) + 1) / 2 * d.breathe;
    headBob = (Math.sin(p - 0.8) + 1) / 2 * d.breathe;
    feet = [[hipX + 2.2, ankleGround], [hipX - 2.2, ankleGround]];
    arms = [0.15 + Math.sin(p) * 0.06, -0.1 + Math.sin(p) * 0.06];
  } else {
    // jump: front knee up, back leg trailing, arms up and back
    feet = [[hipX + 2, ground - legLen * 0.7], [hipX - 3, ground - legLen * 0.35]];
    arms = [1.2, -0.9];
  }
  const hipY = ground - d.bootH - legLen * d.crouch + bob - (pose === 'jump' ? legLen * 0.25 : 0);
  const shoulderX = hipX + lean;
  const shoulderY = hipY - d.torsoH + 1;
  const head = [shoulderX + d.headDX + lean * 0.5, shoulderY - d.headRy + d.neck + (headBob - bob)];
  return { hipX, hipY, shoulderX, shoulderY, head, feet, arms, p, pose, shoot };
}

function drawLeg(b, d, r, foot, back) {
  const [fx, fy] = foot;
  const [kx, ky] = ik(r.hipX, r.hipY, fx, fy, d.thigh, d.shin, 1);
  const armor = back ? RAMP.armorBack : RAMP.armor;
  b.part(capsule(r.hipX, r.hipY, kx, ky, d.legR), back ? RAMP.suitBack : RAMP.suit);
  b.part(capsule(kx, ky, fx, fy, d.legR + 0.3), armor);
  // Boot: heel at the ankle, toe forward.
  b.part(rrect(fx - d.legR - 0.6, fy - 1, fx + d.footLen, fy + d.bootH - 1, 1), armor);
}

function drawArm(b, d, r, swing, back) {
  const sx = r.shoulderX + (back ? -1 : 1);
  const sy = r.shoulderY + 1.5;
  let ex, ey, hx, hy;
  if (r.shoot && !back) {
    // Arm cannon held straight out.
    ex = sx + d.upper * 0.7; ey = sy + 1;
    hx = ex + d.fore + 2; hy = ey;
  } else {
    const bend = r.pose === 'run' ? (back ? 1.6 : 1.15) : r.pose === 'jump' ? 0.9 : 0.35;
    ex = sx + Math.sin(swing) * d.upper; ey = sy + Math.cos(swing) * d.upper;
    hx = ex + Math.sin(swing + bend) * d.fore; hy = ey + Math.cos(swing + bend) * d.fore;
  }
  const armor = back ? RAMP.armorBack : RAMP.armor;
  b.part(capsule(sx, sy, ex, ey, d.armR), back ? RAMP.suitBack : RAMP.suit);
  if (r.shoot && !back) {
    b.part(rrect(ex - 1, ey - 2, hx + 1, ey + 2, 1), armor);
    b.part(rrect(hx - 1, ey - 1.5, hx + 3, ey + 1.5, 0.5), RAMP.metal, { shine: false });
  } else {
    b.part(capsule(ex, ey, hx, hy, d.armR + 0.4), armor);
  }
  // Shoulder pad.
  b.part(ellipse(sx, sy - 0.5, d.padR, d.padR * 0.85), armor);
}

function drawTorso(b, d, r) {
  const x0 = r.hipX - d.torsoW / 2, x1 = r.hipX + d.torsoW / 2;
  const lean = r.shoulderX - r.hipX;
  const belly = r.hipY - d.torsoH * 0.38;
  const lean0 = (y) => lean * (r.hipY - y) / d.torsoH;
  // Undersuit belly, then the armored chest over it.
  b.part((x, y) => rrect(x0 + 1 + lean0(y), belly - 1, x1 - 1 + lean0(y), r.hipY + 1, 1)(x, y), RAMP.suit);
  b.part((x, y) => rrect(x0 + lean0(y), r.shoulderY - 1, x1 + lean0(y), belly, 2)(x, y), RAMP.armor);
  // Belt.
  for (let x = Math.ceil(x0); x <= Math.floor(x1); x++) b.px(x, r.hipY, x === Math.round(r.hipX) ? 'G' : 'S');
  // Core gem on the chest.
  const gx = r.hipX + lean * 0.7 + d.torsoW * 0.15, gy = r.hipY - d.torsoH * 0.68;
  b.px(gx, gy - 1, 'V'); b.px(gx - 1, gy, 'V'); b.px(gx, gy, 'W'); b.px(gx + 1, gy, 'v'); b.px(gx, gy + 1, 'v');
}

function drawHead(b, d, r) {
  const [cx, cy] = r.head;
  b.part(ellipse(cx, cy, d.headRx, d.headRy), RAMP.armor);
  // Visor: the front half, a band across the middle.
  const vy0 = cy - d.headRy * 0.15, vy1 = cy + d.headRy * 0.45;
  for (let y = Math.floor(vy0); y <= Math.ceil(vy1); y++)
    for (let x = Math.floor(cx - 1); x <= Math.ceil(cx + d.headRx); x++) {
      if (!ellipse(cx, cy, d.headRx - 0.9, d.headRy - 0.6)(x + 0.5, y + 0.5)) continue;
      if (y + 0.5 < vy0 || y + 0.5 > vy1 + 0.5) continue;
      const first = y === Math.floor(vy0);
      b.px(x, y, x === Math.floor(cx - 1) ? 'K' : first ? 'K' : y >= Math.ceil(vy1) ? 'v' : 'V');
    }
  b.px(cx + d.headRx * 0.45, vy0 + 1.2, 'W');
  // Ear disc.
  b.px(cx - d.headRx * 0.45, cy + 0.5, 'G'); b.px(cx - d.headRx * 0.45, cy + 1.5, 'g');
  if (d.crest) {
    // Helmet crest: a fin swept back over the top.
    const tx = cx - 0.5, ty = cy - d.headRy + 0.6;
    b.part((x, y) => {
      const up = ty - y; // rows above the helmet top
      return up > -1 && up < d.crest && x > tx - 2.5 - up * 1.1 && x < tx + 1.2 - up * 0.9;
    }, RAMP.metal);
  }
  if (d.antenna) {
    const sway = Math.sin(r.p * 2 - 1.4) * (r.pose === 'run' ? 1.4 : 0.4);
    const bx = cx - d.headRx * 0.5, by = cy - d.headRy + 0.5;
    for (let i = 1; i <= d.antenna; i++) b.px(bx - i * 0.35 + sway * (i / d.antenna) ** 2, by - i, 'g');
    b.px(bx - d.antenna * 0.35 + sway, by - d.antenna - 1, 'V');
  }
}

function drawScarf(b, d, r) {
  // A tail trailing back from the neck; each link lags and waves (follow-through).
  const nx = r.shoulderX - 1, ny = r.shoulderY - 0.5;
  const speed = r.pose === 'run' ? 1 : r.pose === 'jump' ? 0.8 : 0.15;
  let px = nx, py = ny;
  for (let i = 1; i <= d.scarf; i++) {
    const wave = Math.sin(r.p * 2 - i * 0.7) * (0.5 + i * 0.22) * speed;
    const x = nx - i * (0.6 + speed * 0.5);
    const y = ny + i * (1 - speed) * 0.9 + wave + (speed > 0.5 ? i * 0.08 : 0);
    b.part(capsule(px, py, x, y, i < d.scarf - 1 ? 1.2 : 0.8), RAMP.scarf, { shine: false });
    px = x; py = y;
  }
}

function render(d, pose, t, shoot) {
  const r = rig(d, pose, t, shoot);
  const b = new Buf(d.W, d.H);
  if (d.scarf) drawScarf(b, d, r);
  drawArm(b, d, r, r.arms[1], true);
  drawLeg(b, d, r, r.feet[1], true);
  drawLeg(b, d, r, r.feet[0], false);
  drawTorso(b, d, r);
  drawHead(b, d, r);
  drawArm(b, d, r, r.arms[0], false);
  b.outline();
  return b;
}

// --- the designs ---------------------------------------------------------------------------

const DESIGNS = [
  {
    name: 'A  CLASSIC+', tag: "Today's UltraGuy, same 24px size and chunky proportions, with an 8-frame run (bob, arm swing, lean).",
    W: 24, H: 24, hipX: 11, thigh: 3.2, shin: 3.2, legR: 1.5, bootH: 3, footLen: 3, crouch: 0.95,
    torsoW: 8, torsoH: 6, headRx: 5.5, headRy: 5, headDX: 1.5, neck: 1.2, upper: 3.2, fore: 3, armR: 1.3, padR: 1.9,
    stride: 3.6, lift: 2.6, bob: 1, lean: 1, armSwing: 0.9, breathe: 1,
  },
  {
    name: 'B  VANGUARD', tag: 'Taller 32px hero: longer legs and a real stride, broad shoulder pads, a swept helmet crest.',
    W: 32, H: 32, hipX: 15, thigh: 5.2, shin: 5.2, legR: 1.7, bootH: 3, footLen: 3.5, crouch: 0.94,
    torsoW: 9, torsoH: 8, headRx: 5, headRy: 4.8, headDX: 1.2, neck: 1.4, upper: 4.5, fore: 4, armR: 1.4, padR: 2.6,
    stride: 5.5, lift: 3.6, bob: 1.4, lean: 1.4, armSwing: 1.0, breathe: 1, crest: 3,
  },
  {
    name: 'C  POCKET', tag: 'Big-headed and bouncy at 24px: short legs, quick steps and a 2px hop on every stride.',
    W: 24, H: 24, hipX: 11, thigh: 2.4, shin: 2.4, legR: 1.5, bootH: 3, footLen: 3, crouch: 0.93,
    torsoW: 7, torsoH: 4.5, headRx: 6.8, headRy: 6.2, headDX: 1.2, neck: 2.2, upper: 2.5, fore: 2.3, armR: 1.2, padR: 1.6,
    stride: 3, lift: 2.4, bob: 2, lean: 0.6, armSwing: 1.1, breathe: 1,
  },
  {
    name: 'D  STREAK', tag: 'Slim 32px runner built for speed: long legs, deep lean, a scarf and antenna that trail and wave.',
    W: 32, H: 32, hipX: 16, thigh: 5.6, shin: 5.8, legR: 1.4, bootH: 3, footLen: 3.5, crouch: 0.94,
    torsoW: 7, torsoH: 8, headRx: 4.6, headRy: 4.4, headDX: 1.4, neck: 1.3, upper: 4.4, fore: 4.2, armR: 1.2, padR: 2,
    stride: 6, lift: 4, bob: 1.4, lean: 2.2, armSwing: 1.15, breathe: 1, scarf: 7, antenna: 4,
  },
];

// --- page ------------------------------------------------------------------------------------

const RUN_FRAMES = 8;
const TICKS = 4; // game steps per run frame (60 steps a second)
const SCALE = 6;
const grid = document.getElementById('grid');
const shootBox = document.getElementById('shoot');
const slowBox = document.getElementById('slow');
const cards = [];

function makeCanvas(w, h, parent, label) {
  const wrap = document.createElement('div');
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  wrap.appendChild(c);
  if (label) { const l = document.createElement('div'); l.className = 'label'; l.textContent = label; wrap.appendChild(l); }
  parent.appendChild(wrap);
  return c.getContext('2d');
}

function card(title, tag, cls) {
  const el = document.createElement('div');
  el.className = 'card ' + (cls || '');
  el.innerHTML = `<h2>${title}</h2><div class="tag">${tag}</div>`;
  const row = document.createElement('div'); row.className = 'row';
  el.appendChild(row);
  grid.appendChild(el);
  return { el, row };
}

for (const d of DESIGNS) {
  const { el, row } = card(d.name, d.tag);
  const big = makeCanvas(32 * SCALE, 32 * SCALE, row, 'run');
  const idle = makeCanvas(32 * 3, 32 * 3, row, 'idle');
  const jump = makeCanvas(32 * 3, 32 * 3, row, 'jump');
  const lane = makeCanvas(400, 32 * 2 + 8, el, 'at game scale (2x), over a moving floor');
  lane.canvas.parentElement.classList.add('strip');
  const strip = makeCanvas(4 * 34 * 3, 2 * 34 * 3, el, 'the 8 run frames (3x)');
  cards.push({ d, big, idle, jump, lane, strip });
}

// The current hero sheet, for comparison.
const cur = card('CURRENT', "Today's run: three leg poses (1-2-3-2), body, head and arms static.", 'current');
const curBig = makeCanvas(32 * SCALE, 32 * SCALE, cur.row, 'run');
const curLane = makeCanvas(400, 32 * 2 + 8, cur.el, 'at game scale (2x)');
const sheet = new Image();
sheet.src = '/assets/hero.png';
let frameIdx = null;
fetch('/assets/hero.json').then((r) => r.json()).then((j) => (frameIdx = j.frames));

function floor(ctx, w, y, scroll, s) {
  ctx.fillStyle = '#3a4466';
  ctx.fillRect(0, y, w, ctx.canvas.height - y);
  ctx.fillStyle = '#55607a';
  for (let x = -((scroll * s) % (16 * s)); x < w; x += 16 * s) ctx.fillRect(x, y, 1 * s, ctx.canvas.height - y);
  ctx.fillStyle = '#8a8fa8';
  ctx.fillRect(0, y, w, s);
}

let tick = 0;
let last = performance.now();
function loop(now) {
  const step = 1000 / 60 * (slowBox.checked ? 4 : 1);
  while (now - last >= step) { last += step; tick++; }
  const shoot = shootBox.checked;
  const runF = Math.floor(tick / TICKS) % RUN_FRAMES;
  const runT = runF / RUN_FRAMES;
  const idleT = (Math.floor(tick / 12) % 4) / 4;
  for (const c of cards) {
    const { d } = c;
    for (const ctx of [c.big, c.idle, c.jump, c.lane, c.strip]) ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    const off = (32 - d.W) / 2;
    render(d, 'run', runT, shoot).draw(c.big, off * SCALE, (32 - d.H) * SCALE, SCALE);
    render(d, 'idle', idleT, false).draw(c.idle, off * 3, (32 - d.H) * 3, 3);
    render(d, 'jump', 0, shoot).draw(c.jump, off * 3, (32 - d.H) * 3, 3);
    floor(c.lane, 400, 64, tick * 1.375, 2);
    render(d, 'run', runT, shoot).draw(c.lane, 180, 64 - d.H * 2 + 2, 2);
    for (let i = 0; i < RUN_FRAMES; i++) render(d, 'run', i / RUN_FRAMES, shoot).draw(c.strip, (i % 4) * 102 + (32 - d.W) * 1.5, Math.floor(i / 4) * 102 + (32 - d.H) * 3 + 3, 3);
  }
  // Current: run1, run2, run3, run2 at 7 steps each.
  if (frameIdx && sheet.complete) {
    const name = ['run1', 'run2', 'run3', 'run2'][Math.floor(tick / 7) % 4] + (shoot ? '_s' : '');
    const fi = frameIdx[name];
    for (const ctx of [curBig, curLane]) { ctx.imageSmoothingEnabled = false; ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height); }
    curBig.drawImage(sheet, fi * 24, 0, 24, 24, 4 * SCALE, 8 * SCALE, 24 * SCALE, 24 * SCALE);
    floor(curLane, 400, 64, tick * 1.375, 2);
    curLane.drawImage(sheet, fi * 24, 0, 24, 24, 180, 64 - 48 + 2, 48, 48);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
