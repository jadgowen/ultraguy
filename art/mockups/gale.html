<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>GALE design mockups</title>
<style>
  body { margin: 0; background: #0b0d1a; color: #fff1e0; font: 14px/1.4 ui-monospace, Menlo, monospace; }
  h1 { font-size: 18px; color: #f28c28; margin: 16px 20px 4px; }
  p.lead { margin: 0 20px 12px; color: #8a8fa8; max-width: 980px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 14px; padding: 0 20px 24px; }
  .card { background: #141626; border: 2px solid #3a3f66; border-radius: 6px; padding: 12px; }
  .card.current { border-color: #55607a; }
  .card h2 { margin: 0; font-size: 15px; color: #5ef0c8; }
  .card .tag { color: #8a8fa8; font-size: 12px; margin: 2px 0 8px; }
  canvas { image-rendering: pixelated; background: #1c1f36; border-radius: 3px; display: block; }
  .poses { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .poses div { font-size: 11px; color: #8a8fa8; text-align: center; }
  .controls { margin: 0 20px 12px; display: flex; gap: 16px; color: #8a8fa8; }
  .controls label { cursor: pointer; }
</style>
</head>
<body>
<script src="kit.js"></script>
<script>
const PAL = {
  K: '#1a1428', W: '#ffffff', w: '#e6eef8', G: '#b8c4d8', g: '#7a88a8', d: '#3a4458', x: '#1e1a30',
  // sky blues
  C: '#e6f8ff', B: '#9ee0f8', b: '#4a9ad8', n: '#2a5aa8',
  // gold accents, steel feathers
  Y: '#ffe14a', y: '#d8a020', S: '#c8d4e8', s: '#8a9ab8', t: '#5a6a88',
  // mask
  P: '#fff4f0', p: '#e8d0d0', R: '#e86a8a',
};
const R = (shine, light, base, dark) => ({ shine, light, base, dark });
const W = 48, H = 44;
const MOVES = [
  { name: 'hover', len: 70 }, { name: 'blow', len: 50 }, { name: 'hover', len: 20 }, { name: 'tornado', len: 40 },
  { name: 'aim', len: 22 }, { name: 'dive', len: 32 }, { name: 'hover', len: 20 },
];
function pose(m, f) {
  const P = { t: f, flap: Math.sin(f * 0.3), bob: Math.sin(f * 0.07), blow: 0, throwing: 0, dive: 0, aim: 0 };
  if (m.name === 'blow') { P.blow = 1; P.flap = Math.sin(f * 0.6); }
  if (m.name === 'tornado') P.throwing = m.t < 20 ? m.t / 20 : 1;
  if (m.name === 'aim') { P.aim = 1; P.flap = 0.8; }
  if (m.name === 'dive') { P.dive = 1; P.flap = -0.6; }
  return P;
}

function gale(P, s) {
  const b = new Buf(W, H, PAL);
  const cx = 24, cy = 22;
  const tilt = P.dive ? 4 : P.aim ? -2 : 0;
  // Back wing, body, front wing; each design dresses them its own way.
  const wing = (side) => {
    const up = P.flap * 6 * (P.dive ? 0.3 : 1);
    const root = [cx + side * 7, cy - 1 + tilt * 0.3];
    if (s.feathers) {
      for (let i = 0; i < 4; i++) {
        const a = (side < 0 ? Math.PI : 0) + side * (-0.5 + i * 0.32) - side * up * 0.05;
        const len = 15 - i * 2;
        b.part(capsule(root[0], root[1], root[0] + Math.cos(a) * len, root[1] + Math.sin(a) * len - up, 1.6), side < 0 ? s.wingBack : s.wing);
      }
    } else if (s.ribbons) {
      const pts = [];
      for (let i = 0; i <= 6; i++) pts.push([root[0] + side * i * 2.4, root[1] + Math.sin(P.t * 0.2 + i * 0.9 + side) * 2 - i * 0.5 - up * i * 0.12]);
      for (const [x, y] of pts) b.part(ellipse(x, y, 1.8, 1.4), side < 0 ? s.wingBack : s.wing, { shine: false });
    } else {
      b.part(poly([[root[0], root[1] - 2], [root[0] + side * 13, root[1] - 5 - up], [root[0] + side * 11, root[1] + 3 - up * 0.5], [root[0], root[1] + 3]]), side < 0 ? s.wingBack : s.wing);
    }
  };
  wing(-1);
  if (s.cloud) {
    // A cloud body: puffs.
    for (const [dx, dy, r] of [[-6, 2, 6], [6, 2, 6], [0, -2, 8], [0, 5, 6], [-9, -1, 4], [9, -1, 4]]) b.part(ellipse(cx + dx, cy + dy + P.bob * 0.6, r, r * 0.85), s.body);
  } else {
    b.part(ellipse(cx, cy + tilt * 0.2, 9, 10), s.body);
    b.part(rrect(cx - 9, cy - 1, cx + 9, cy + 2, 1), s.band, { shine: false });
  }
  // Face: a visor (egg-bot), eyes and a crest (harpy), a porcelain mask (cloud).
  if (s.mask) {
    b.part(ellipse(cx + 2, cy - 1, 5.5, 6.5), s.mask);
    b.rect(cx, cy - 3, 2, 1, 'K'); b.rect(cx + 4, cy - 3, 2, 1, 'K');
    b.px(cx + 1, cy - 2, 'R'); b.px(cx + 5, cy - 2, 'R');
    if (P.blow) b.part(ellipse(cx + 3, cy + 3, 1.6, 1.6), R('K', 'K', 'x', 'x')); else b.rect(cx + 2, cy + 3, 3, 1, 'p');
  } else if (s.visor) {
    b.part(rrect(cx - 1, cy - 4, cx + 8, cy - 1, 1), s.visor);
    b.rect(cx + 1, cy - 4, 3, 1, 'C');
  }
  if (s.crest) b.part(poly([[cx - 2, cy - 9], [cx - 10, cy - 16], [cx - 6, cy - 9], [cx - 12, cy - 12], [cx - 3, cy - 6]]), s.crest);
  if (s.tail) b.part(poly([[cx - 6, cy + 6], [cx - 16, cy + 14], [cx - 9, cy + 13], [cx - 13, cy + 18], [cx - 4, cy + 9]]), s.wingBack);
  if (s.eyes) { b.part(ellipse(cx + 4, cy - 3, 2, 1.6), R('W', 'Y', 'Y', 'y')); b.px(cx + 5, cy - 3, 'K'); }
  // The propeller: a hub and a blade that blurs as it spins (wide, then edge-on).
  if (s.prop) {
    b.part(rrect(cx - 1, cy - 13, cx + 1, cy - 9, 0.5), s.band);
    const wide = Math.floor(P.t / 2) % 2 === 0;
    b.part(rrect(cx - (wide ? 11 : 4), cy - 15, cx + (wide ? 11 : 4), cy - 14, 0.5), R('W', 'W', 'G', 'g'), { shine: false });
  }
  // Feet tucked (the egg-bot and harpy).
  if (!s.cloud) for (const fx of [-3, 3]) b.part(rrect(cx + fx - 1.5, cy + 9, cx + fx + 1.5, cy + 12, 0.5), s.band);
  wing(1);
  b.outline();
  return { b, glow: { eye: [cx + 4, cy - 2.5], mouth: [cx + 10, cy + 2] } };
}
const STYLES = {
  egg: { body: R('W', 'W', 'w', 'G'), band: R('B', 'b', 'b', 'n'), wing: R('C', 'B', 'b', 'n'), wingBack: R('B', 'b', 'n', 'x'), visor: R('C', 'B', 'b', 'n'), prop: true },
  harpy: { body: R('W', 'S', 'S', 's'), band: R('Y', 'Y', 'y', 'y'), wing: R('W', 'S', 's', 't'), wingBack: R('S', 's', 't', 'x'), feathers: true, crest: R('Y', 'Y', 'y', 'y'), tail: true, eyes: true },
  cloud: { body: R('W', 'W', 'w', 'G'), band: R('W', 'w', 'G', 'g'), wing: R('C', 'B', 'B', 'b'), wingBack: R('B', 'b', 'b', 'n'), ribbons: true, cloud: true, mask: R('P', 'P', 'p', 'g') },
};
Kit.start({
  name: 'GALE',
  lead: "Each card plays Gale's move set: hovering, a gust that pushes you back (wind streaks), a pair of tornadoes thrown low and high, then she takes aim and dives at you. Big view 5x next to UltraGuy; game-scale poses below. Wind streaks and tornadoes are effects added on top. CURRENT is today's three poses.",
  currentTag: "Today's Gale: three poses (idle, blow, dive).",
  currentFrame: (m) => (m.name === 'blow' || m.name === 'tornado' ? 'gale_blow' : m.name === 'dive' ? 'gale_dive' : 'gale_idle'),
  floor: ['#5a7ab8', '#ffffff'],
  backdrop: (ctx, w, h) => { const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#6ab0f0'); g.addColorStop(1, '#c8e4ff'); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); },
  moves: MOVES, pose,
  minis: [['hover', { name: 'hover', t: 0, k: 0 }], ['blow', { name: 'blow', t: 10, k: 0.3 }], ['tornado', { name: 'tornado', t: 25, k: 0.6 }], ['dive', { name: 'dive', t: 10, k: 0.3 }]],
  place: (m, P) => {
    const hover = 12 + P.bob * 2;
    if (m.name === 'dive') return { x: lerp(66, 34, m.k), lift: hover - Math.sin(m.k * Math.PI) * 10 };
    return { x: 66, lift: hover };
  },
  effects: (env) => {
    const { ctx, m, card, S, fi, ox, oy, glow, groundY } = env;
    if (env.current) return;
    if (m.name === 'blow' && fi % 2 === 0) for (let i = 0; i < 2; i++) Kit.push(card, { x: ox + glow.mouth[0] * S - 20, y: oy + (8 + Math.random() * 30) * S, vx: -12 - Math.random() * 6, vy: 0, life: 24, streak: true });
    if (m.name === 'tornado' && (m.t === 16 || m.t === 30)) Kit.push(card, { x: ox + 10 * S, y: m.t === 16 ? groundY - 10 * S : groundY - 26 * S, vx: -6, vy: 0, life: 60, tornado: true, a: 0 });
    if (m.name === 'dive' && fi % 2 === 0) Kit.push(card, { x: ox + 30 * S, y: oy + 22 * S, vx: 3, vy: 0, life: 14, streak: true });
    Kit.run(env, (p) => {
      if (p.streak) { ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fillRect(p.x, p.y, 8 * S, S * 0.6); }
      if (p.tornado) { p.a += 0.5; for (let i = 0; i < 5; i++) { ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.85)' : 'rgba(158,224,248,0.85)'; const w = (2 + i) * S; ctx.fillRect(p.x - w / 2 + Math.sin(p.a + i) * S, p.y - i * 2 * S, w, 1.6 * S); } }
    });
    glowAt(ctx, ox + glow.eye[0] * S, oy + glow.eye[1] * S, 4 * S, '158,232,255', 0.4);
  },
  designs: [
    { id: 'egg', name: 'A. PROPELLER GALE+', tag: "Today's Gale drawn properly: a white egg-shaped flier with a blue band and visor, a propeller on top that blurs as it spins, and ice-blue blade wings that flap. Closest to now.", draw: (P) => gale(P, STYLES.egg) },
    { id: 'harpy', name: 'B. STORM HARPY', tag: 'A robot harpy: a sleek silver body with fans of steel feather-blades for wings, a gold crest plume, tail feathers and golden eyes. Regal: the Queen of the High Winds looks the part. Her wings fold back for the dive.', draw: (P) => gale(P, STYLES.harpy) },
    { id: 'cloud', name: 'C. CLOUD SPIRIT', tag: 'A storm cloud with a porcelain mask for a face and ribbons of wind for arms that ripple as she moves; she puffs her mask\'s cheeks to blow. The most whimsical, and the most "air".', draw: (P) => gale(P, STYLES.cloud) },
  ],
});

</script>
</body>
</html>
